name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / Bun 1.4.5
            os: ubuntu-latest
            bun-version: 1.4.5
          - name: Ubuntu / Bun latest
            os: ubuntu-latest
            bun-version: latest
          - name: macOS / Bun latest
            os: macos-latest
            bun-version: latest
          - name: Windows / Bun latest
            os: windows-latest
            bun-version: latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate compatibility
        run: bun run --parallel typecheck test build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install test shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish zsh

      - name: Check coverage
        run: bun run coverage

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package for consumer linting
        run: bun run build:artifacts

      - name: Lint project
        run: bun run lint

      - name: Check formatting
        run: bun run format:check
